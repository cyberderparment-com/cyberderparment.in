<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            position: relative;
            min-height: 100vh;
            padding-top: 150px;
            overflow-x: hidden;
        }
        .header {
            background-color: #004080;
            color: white;
            text-align: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 4px solid #FFD700;
        }
        .header .logo { width: 90px; }
        .header .nav a {
            color: white;
            text-decoration: none;
            padding: 5px;
            font-size: 16px;
        }
        .notice {
            background-color: #003366;
            color: #FFFFF0;
            padding: 10px;
            animation: marquee 15s linear infinite;
            white-space: nowrap;
        }
        @keyframes marquee {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }
        fieldset {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: #f9f9f9;
        }
        label { display: block; font-weight: bold; margin-top: 10px; }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
        }
        button {
            padding: 12px;
            background-color: #004080;
            color: white;
            border: none;
            width: 100%;
            cursor: pointer;
        }
        #imagePreview img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            margin: 5px;
        }
        .success-message {
            display: none;
            text-align: center;
            margin-top: 150px;
            font-size: 24px;
            color: #004080;
        }
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 6px solid #ccc;
            border-top: 6px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
<div class="header">
    <img src="st.jpeg" class="logo">
    <div class="nav">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>
    <div class="notice">Important Notice: Please ensure all details and images are accurately filled and uploaded.</div>
</div>

<div class="container" id="formContainer">
    <form id="complaintForm">
        <fieldset>
            <legend>User Details</legend>
            <input required placeholder="Name">
            <input required placeholder="Age">
            <input required placeholder="Country">
            <input required placeholder="State">
            <input required placeholder="City">
            <input required placeholder="District">
            <input required placeholder="Phone">
            <input required placeholder="Education">
        </fieldset>

        <fieldset>
            <legend>Complaint</legend>
            <textarea required rows="4"></textarea>
        </fieldset>

        <fieldset>
            <legend>Enter Victim Images</legend>
            <input type="file" id="imageUpload" multiple accept="image/*" onchange="handleFileSelect(event)">
            <div id="imagePreview"></div>
        </fieldset>

        <button type="submit">Submit Complaint</button>
    </form>
</div>

<div class="success-message" id="successMessage">
    Complaint Registered Successfully!
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
</div>

<script>
const CLOUD_NAME = "dspfi07ar";
const UPLOAD_PRESET = "complaints_upload";

function handleFileSelect(event) {
    const preview = document.getElementById("imagePreview");
    preview.innerHTML = "";
    for (let file of event.target.files) {
        const reader = new FileReader();
        reader.onload = e => {
            const img = document.createElement("img");
            img.src = e.target.result;
            preview.appendChild(img);
        };
        reader.readAsDataURL(file);
    }
}

async function uploadImages(files) {
    const urls = [];
    const folder = "complaint_" + Date.now();

    for (let file of files) {
        const fd = new FormData();
        fd.append("file", file);
        fd.append("upload_preset", UPLOAD_PRESET);
        fd.append("folder", "complaints_images/" + folder);

        const res = await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
            { method: "POST", body: fd }
        );

        if (!res.ok) throw new Error("Upload failed");

        const data = await res.json();
        urls.push(data.secure_url);
    }
    return urls;
}

document.getElementById("complaintForm").addEventListener("submit", async e => {
    e.preventDefault();
    document.getElementById("loadingOverlay").style.display = "flex";

    try {
        const files = document.getElementById("imageUpload").files;
        const imageUrls = await uploadImages(files);
        console.log("Saved images:", imageUrls);

        document.getElementById("loadingOverlay").style.display = "none";
        document.getElementById("formContainer").style.display = "none";
        document.getElementById("successMessage").style.display = "block";
    } catch (err) {
        alert("Image upload failed");
        document.getElementById("loadingOverlay").style.display = "none";
    }
});
</script>
</body>
</html>
